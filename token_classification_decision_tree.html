<!-- Title -->
<text class="th" x="340" y="24" text-anchor="middle" style="font-size:15px">Where does your token land?</text>
<text class="ts" x="340" y="42" text-anchor="middle">Classification under SEC/CFTC Release No. 33-11412 (Mar. 17, 2026)</text>

<g class="c-gray">
  <rect x="115" y="62" width="450" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="88" text-anchor="middle" dominant-baseline="central">Does it represent a traditional financial instrument onchain?</text>
</g>
<text class="ts" x="556" y="88" dominant-baseline="central" style="font-style:italic">§III.E p.23</text>

<line x1="226" y1="106" x2="130" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="120" text-anchor="middle" style="font-weight:500">Yes</text>
<line x1="454" y1="106" x2="454" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="126" style="font-weight:500">No</text>

<!-- Terminal: Digital security -->
<g class="c-red">
  <rect x="40" y="142" width="180" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="162" text-anchor="middle" dominant-baseline="central">Digital security</text>
  <text class="ts" x="130" y="180" text-anchor="middle" dominant-baseline="central">IS a security · §III.E p.23</text>
</g>

<!-- ── Q2: Stable value? ──────────────────────────────── -->
<g class="c-gray">
  <rect x="290" y="142" width="330" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="455" y="168" text-anchor="middle" dominant-baseline="central">Designed to maintain stable value (e.g., pegged to USD)?</text>
</g>

<line x1="370" y1="186" x2="200" y2="224" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="268" y="202" text-anchor="middle" style="font-weight:500">Yes</text>
<line x1="530" y1="186" x2="530" y2="224" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="350" y="226" width="290" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="495" y="247" text-anchor="middle" dominant-baseline="central">Is the token native to a live, functional system?</text>
  <text class="ts" x="495" y="268" text-anchor="middle" dominant-baseline="central">(Gas, staking, governance — not aspirational)</text>
</g>
<text class="ts" x="495" y="296" text-anchor="middle" style="font-style:italic">§III.A p.14 n.49 "functional" · n.1 "native"</text>

<line x1="420" y1="282" x2="280" y2="336" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="570" y1="282" x2="570" y2="336" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="586" y="312" style="font-weight:500">No</text>

<g class="c-gray">
  <rect x="130" y="338" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="280" y="358" text-anchor="middle" dominant-baseline="central">Also: passive yield or rights to future income?</text>
  <text class="ts" x="280" y="378" text-anchor="middle" dominant-baseline="central">(Fee switch active, revenue share, yield mechanics)</text>
</g>
<text class="ts" x="280" y="408" text-anchor="middle" style="font-style:italic">§III.A p.14 · yield/income rights disqualify digital commodity</text>

<line x1="200" y1="394" x2="120" y2="438" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="360" y1="394" x2="360" y2="438" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="376" y="418" style="font-weight:500">No</text>

  <text class="ts" x="120" y="478" text-anchor="middle" dominant-baseline="central">Yield present — not a</text>
  <text class="ts" x="120" y="494" text-anchor="middle" dominant-baseline="central">clean commodity</text>
</g>

<!-- Terminal: Digital commodity -->
<g class="c-green">
  <rect x="280" y="440" width="200" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="380" y="460" text-anchor="middle" dominant-baseline="central">Digital commodity</text>
  <text class="ts" x="380" y="478" text-anchor="middle" dominant-baseline="central">NOT a security · §III.A p.14</text>
</g>

<g class="c-gray">
  <rect x="470" y="338" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="358" text-anchor="middle" dominant-baseline="central">Collected or used?</text>
  <text class="ts" x="560" y="378" text-anchor="middle" dominant-baseline="central">(Art, memes, in-game, culture)</text>
</g>

<line x1="510" y1="394" x2="420" y2="530" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="460" text-anchor="middle" style="font-weight:500">Yes</text>
<line x1="610" y1="394" x2="610" y2="530" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="626" y="460" style="font-weight:500">No</text>

<g class="c-gray">
  <rect x="320" y="532" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="420" y="558" text-anchor="middle" dominant-baseline="central">Is it fractionalized?</text>
</g>

<line x1="370" y1="576" x2="300" y2="618" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="470" y1="576" x2="470" y2="618" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="486" y="598" style="font-weight:500">No</text>

<g class="c-amber">
  <rect x="210" y="620" width="180" height="50" rx="8" stroke-width="0.5"/>

  <text class="ts" x="300" y="658" text-anchor="middle" dominant-baseline="central">Consult counsel · p.19–20</text>
</g>

<g class="c-teal">
  <rect x="410" y="620" width="180" height="50" rx="8" stroke-width="0.5"/>

  <text class="ts" x="500" y="658" text-anchor="middle" dominant-baseline="central">NOT a security · §III.B p.16</text>
</g>

  <rect x="520" y="532" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="590" y="552" text-anchor="middle" dominant-baseline="central">Practical function?</text>
  <text class="ts" x="590" y="572" text-anchor="middle" dominant-baseline="central">(Ticket, credential, ID)</text>
</g>

<line x1="558" y1="588" x2="500" y2="710" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="650" text-anchor="middle" style="font-weight:500">Yes</text>
<line x1="622" y1="588" x2="622" y2="710" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="638" y="650" style="font-weight:500">No</text>

  <rect x="400" y="712" width="165" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="482" y="732" text-anchor="middle" dominant-baseline="central">Digital tool</text>
  <text class="ts" x="482" y="750" text-anchor="middle" dominant-baseline="central">NOT a security · §III.C p.20</text>

<g class="c-gray">
  <rect x="572" y="712" width="100" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="622" y="732" text-anchor="middle" dominant-baseline="central">Hybrid /</text>
  <text class="th" x="622" y="750" text-anchor="middle" dominant-baseline="central">unclear</text>
</g>
<text class="ts" x="622" y="772" text-anchor="middle">Counsel · p.13</text>

<!-- ── Key box ─────────────────────────────────────────── -->
<rect x="40" y="800" width="600" height="108" rx="8" fill="#F5F1EB" stroke="none"/>
<text class="th" x="60" y="822">Key: what happens after classification?</text>
<text class="ts" x="60" y="844">Non-security tokens can still be sold subject to an investment contract if the issuer makes pre-sale</text>
<text class="ts" x="60" y="862">representations promising essential managerial efforts from which purchasers would expect profits.</text>
<text class="ts" x="60" y="880">The token is not the security. The transaction is. The token can later separate. (§IV.A–B, p.24–31)</text>
<text class="ts" x="60" y="898" style="font-style:italic">Q3b note: yield or income rights disqualify clean digital commodity status even with functional utility. (§III.A p.14)</text>
